<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08070d">
<title>STARBOUND — Prototype 0.2</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="apple-touch-icon" href="starbound-icon.svg">
<style>
:root{--red:#ff344f;--bg:#08070d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand{font-weight:900;letter-spacing:.18em;font-size:20px;text-shadow:0 0 18px var(--red)}.sub{font-size:9px;letter-spacing:.15em;color:#c7b5bd}.panel{background:#100d17e8;border:1px solid #ff344f88;border-radius:12px;padding:9px 11px;backdrop-filter:blur(8px);box-shadow:0 0 20px #ff344f18}.stats{text-align:right;font-size:11px;line-height:1.8}.stats b{color:#ff7182}.mission{font-size:11px;max-width:230px;line-height:1.4}.mission b{display:block;color:#ff7182;letter-spacing:.12em;margin-bottom:4px}.bottom{align-items:flex-end}.hint{font-size:10px;color:#c6b4bd;line-height:1.5;max-width:145px}.actions{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}button{border:1px solid #ff536caa;border-radius:10px;background:#170e19;color:#fff;padding:10px 11px;font-size:11px;font-weight:800;box-shadow:0 0 12px #ff344f20;touch-action:manipulation}button:active{background:#651b2d;transform:scale(.97)}#pad{position:absolute;left:12px;bottom:85px;display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:4px;pointer-events:auto}#pad button{padding:0;font-size:16px;background:#130d1be8}#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}#boost{grid-column:2;grid-row:3;font-size:10px}#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);background:#170d18;border:1px solid var(--red);border-radius:10px;padding:10px 13px;font-size:12px;display:none;max-width:85%;text-align:center}.centerhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;color:#ff8292;opacity:.8;pointer-events:none}@media(min-width:700px){.hud{padding:20px}.brand{font-size:24px}#pad{left:20px;bottom:100px}}
.panel.mission{position:absolute;left:12px;top:78px;width:min(240px,58vw);z-index:10;font-size:11px;line-height:1.5}  /* Stop long-press selection menus */
html, body, canvas, button, .panel {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
} </style></head><body>
<canvas id="space"></canvas><div class="centerhint">✦</div><div class="toast" id="toast"></div>
<div class="hud"><div class="top"><div><div class="brand">STARBOUND</div><div class="sub">OPEN-SPACE PROTOTYPE // 0.2</div></div><div class="panel stats">HULL <b>100%</b><br>ENERGY <b id="energy">100%</b><br>CRYSTALS <b id="crystals">0</b><br>SECTOR <b id="sector">01</b></div></div>
<div class="top"><div class="panel mission"><b>ACTIVE MISSION</b><span id="mission">Find the crimson planet. The ship is at the center of the screen.</span></div></div>
<div class="bottom"><div class="hint">Hold arrows to fly<br>Hold BOOST to accelerate<br>Fly close to a planet and SCAN</div><div class="actions"><button id="scan">SCAN</button><button id="land">LAND / EXPLORE</button><button id="map">STAR MAP</button><button id="save">SAVE</button> <button id="upgrades">UPGRADE STATION</button>/div></div></div>

<div id="upgradePanel" class="panel" style="display:none;position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;max-width:380px;max-height:80vh;overflow:auto;pointer-events:auto;background:#100d17;border-color:#ff344f">
<b style="color:#ff7182">◆ UPGRADE STATION</b>
<p>Crystals: <b id="shopCrystals">90</b></p>
<div id="upgradeList"></div>
<button id="closeUpgrades">CLOSE</button>
</div>
  <div id="pad"><button id="up" aria-label="thrust">▲</button><button id="left" aria-label="turn left">◀</button><button id="down" aria-label="reverse">▼</button><button id="right" aria-label="turn right">▶</button><button id="boost">BOOST</button></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('space'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const stars=Array.from({length:230},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,a:Math.random()*.7+.2}));
const planets=[{name:'CRIMSON-7',x:300,y:-100,r:47,c:'#a9233f',glow:'#ff244b',resource:3,scanned:false},{name:'THE VEIL',x:-330,y:170,r:66,c:'#4d2b67',glow:'#a65dff',resource:2,scanned:false},{name:'FROSTLINE',x:520,y:300,r:35,c:'#497f9e',glow:'#67d9ff',resource:5,scanned:false},{name:'EMBER-IX',x:-620,y:-300,r:54,c:'#9c4b23',glow:'#ff873b',resource:4,scanned:false}];
const ship={x:0,y:0,vx:0,vy:0,angle:-.2};let cam={x:0,y:0},energy=100,crystals=0,landed=null;const held={};let last=performance.now();
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2100)}function nearest(){return planets.map(p=>({...p,d:Math.hypot(p.x-ship.x,p.y-ship.y)})).sort((a,b)=>a.d-b.d)[0]}function screen(x,y){return{x:W/2+x-cam.x,y:H/2+y-cam.y}}
function drawPlanet(p){const s=screen(p.x,p.y);if(s.x<-120||s.x>W+120||s.y<-120||s.y>H+120)return;let g=ctx.createRadialGradient(s.x,s.y,p.r*.2,s.x,s.y,p.r*1.8);g.addColorStop(0,p.glow+'88');g.addColorStop(1,'#08070d00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,p.r*1.8,0,Math.PI*2);ctx.fill();let q=ctx.createRadialGradient(s.x-p.r*.35,s.y-p.r*.35,1,s.x,s.y,p.r);q.addColorStop(0,p.c);q.addColorStop(.8,p.c);q.addColorStop(1,'#07060b');ctx.fillStyle=q;ctx.beginPath();ctx.arc(s.x,s.y,p.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=p.glow;ctx.globalAlpha=.75;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(s.x,s.y,p.r*1.3,p.r*.28,-.22,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillStyle='#f7dce2';ctx.fillText(p.name,s.x,s.y+p.r+16)}
function drawShip(){const s=screen(ship.x,ship.y);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ship.angle);ctx.shadowBlur=24;ctx.shadowColor='#ff2347';ctx.fillStyle='#ff344f';ctx.beginPath();ctx.moveTo(25,0);ctx.lineTo(-13,-12);ctx.lineTo(-7,0);ctx.lineTo(-13,12);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff5f7';ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-5,-4);ctx.lineTo(-2,0);ctx.lineTo(-5,4);ctx.closePath();ctx.fill();ctx.fillStyle='#ff9a53';ctx.beginPath();ctx.moveTo(-8,-5);ctx.lineTo(held.boost?-35:-17,0);ctx.lineTo(-8,5);ctx.closePath();ctx.fill();ctx.restore();ctx.strokeStyle='#ff536c55';ctx.beginPath();ctx.arc(s.x,s.y,32,0,Math.PI*2);ctx.stroke()}
function frame(now){const dt=Math.min((now-last)/16.67,2);last=now;ctx.clearRect(0,0,W,H);const bg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.8);bg.addColorStop(0,'#17101e');bg.addColorStop(1,'#05050a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(const st of stars){const x=((st.x*W-ship.x*.12)%W+W)%W,y=((st.y*H-ship.y*.12)%H+H)%H;ctx.globalAlpha=st.a;ctx.fillStyle='#e9dce8';ctx.fillRect(x,y,st.r,st.r)}ctx.globalAlpha=1;planets.forEach(drawPlanet);drawShip();
if(!landed){if(held.left)ship.angle-=.055*dt;if(held.right)ship.angle+=.055*dt;if(held.up){ship.vx+=Math.cos(ship.angle)*.18*dt;ship.vy+=Math.sin(ship.angle)*.18*dt}if(held.down){ship.vx-=Math.cos(ship.angle)*.12*dt;ship.vy-=Math.sin(ship.angle)*.12*dt}if(held.boost&&energy>0){ship.vx+=Math.cos(ship.angle)*.3*dt;ship.vy+=Math.sin(ship.angle)*.3*dt;energy=Math.max(0,energy-.16*dt)}else energy=Math.min(100,energy+.04*dt);ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;ship.vx*=Math.pow(.985,dt);ship.vy*=Math.pow(.985,dt);cam.x+=(ship.x-cam.x)*.09;cam.y+=(ship.y-cam.y)*.09}document.getElementById('energy').textContent=Math.round(energy)+'%';document.getElementById('crystals').textContent=crystals;document.getElementById('sector').textContent=String(1+Math.floor(Math.hypot(ship.x,ship.y)/1000)).padStart(2,'0');requestAnimationFrame(frame)}requestAnimationFrame(frame);
function bindHold(id,key){const el=document.getElementById(id);const start=e=>{e.preventDefault();held[key]=true};const end=e=>{e.preventDefault();held[key]=false};el.addEventListener('pointerdown',start);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('pointerleave',end)}bindHold('up','up');bindHold('down','down');bindHold('left','left');bindHold('right','right');bindHold('boost','boost');
addEventListener('keydown',e=>{const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right',' ':'boost'};if(map[e.key.toLowerCase()]){held[map[e.key.toLowerCase()]]=true;e.preventDefault()}});addEventListener('keyup',e=>{const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right',' ':'boost'};if(map[e.key.toLowerCase()])held[map[e.key.toLowerCase()]]=false});
document.getElementById('scan').addEventListener('click',()=>{if(landed){toast('Return to orbit first.');return}const p=nearest();if(p.d>p.r+125){toast('Fly closer to '+p.name+' to scan.');return}if(p.scanned){toast(p.name+' is already scanned.');return}p.scanned=true;energy=Math.max(0,energy-8);document.getElementById('mission').textContent='Scan complete! Land on a nearby planet to collect crystals.';toast('SCAN COMPLETE: '+p.name)});
document.getElementById('land').addEventListener('click',()=>{if(landed){landed=null;document.getElementById('mission').textContent='Back in orbit. Find another planet to explore.';toast('Returned to orbit.');return}const p=nearest();if(p.d>p.r+65){toast('Fly closer to a planet before landing.');return}landed=p;crystals+=p.resource;energy=Math.min(100,energy+12);p.scanned=true;document.getElementById('mission').textContent='Expedition complete! Collected '+p.resource+' crystals. Tap LAND / EXPLORE to return.';toast('Landed on '+p.name+' — collected '+p.resource+' crystals!')});
document.getElementById('map').addEventListener('click',()=>toast(planets.map(p=>p.name+': '+Math.round(Math.hypot(p.x-ship.x,p.y-ship.y))+'u').join(' | ')));
document.getElementById('save').addEventListener('click',()=>{try{localStorage.setItem('starbound-save-v2',JSON.stringify({ship,energy,crystals,scanned:planets.map(p=>p.scanned)}));toast('Progress saved on this device.')}catch(e){toast('Browser save unavailable.')}});try{const s=JSON.parse(localStorage.getItem('starbound-save-v2')||'null');if(s){Object.assign(ship,s.ship||{});energy=s.energy??100;crystals=s.crystals||0;(s.scanned||[]).forEach((v,i)=>{if(planets[i])planets[i].scanned=v})}}catch(e){}
})();
</script></body></html>
